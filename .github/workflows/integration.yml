name: Integration

# Applies against a real Cloudflare test account.
# Never runs on pull_request: fork pull requests cannot read organisation secrets.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration
  cancel-in-progress: false

jobs:
  integration:
    name: terraform test (live)
    runs-on: ubuntu-latest
    environment: integration
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_account_id: ${{ secrets.CLOUDFLARE_TEST_ACCOUNT_ID }}
      TF_VAR_zone_id: ${{ secrets.CLOUDFLARE_TEST_ZONE_ID }}
      TF_VAR_zone_name: ${{ secrets.CLOUDFLARE_TEST_ZONE_NAME }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Init
        run: terraform init -backend=false -input=false

      - name: Run integration tests
        run: terraform test -filter=tests/integration.tftest.hcl -verbose
