version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    assignees:
      - "clouddrove-ci"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "terraform"
    directories:
      - "/"
      - "/modules/*"
      - "/examples/*"
      - "/wrappers"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    assignees:
      - "clouddrove-ci"
    commit-message:
      prefix: "fix"
